---
services:
    unifi-network-application:
        image: lscr.io/linuxserver/unifi-network-application:9.5.21
        container_name: unifi-network-application
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/New_York
            - MONGO_USER=unifi
            - MONGO_PASS=5nHgg3G0cH9d
            - MONGO_HOST=unifi-db
            - MONGO_PORT=27017
            - MONGO_DBNAME=unifi
            - MONGO_AUTHSOURCE=unifi
            - MEM_LIMIT=1024 #optional
            - MEM_STARTUP=1024 #optional
            # - MONGO_TLS= #optional
        volumes:
            - data:/config
        ports:
            - 8443:8443
            - 3478:3478/udp
            - 10001:10001/udp
            - 8080:8080
        depends_on:
            unifi-db:
                condition: service_healthy
        networks:
            unifi:
        restart: unless-stopped
    unifi-db:
        image: docker.io/mongo:7.0.37
        container_name: unifi-db
        volumes:
            - db:/data/db
            - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
        healthcheck:
            test:
                [
                    "CMD",
                    "mongosh",
                    "--quiet",
                    "--eval",
                    "db.adminCommand('ping').ok",
                ]
            interval: 30s
            timeout: 10s
            retries: 5
        networks:
            unifi:
        restart: unless-stopped

volumes:
    data:
    db:

networks:
    unifi:
